<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="连接游戏流程示意图">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00d4a4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="220" rx="12" fill="#1c1c1e"/>
  <g font-family="sans-serif">
    <rect x="24" y="70" width="120" height="64" rx="8" fill="#26262a"/>
    <text x="84" y="96" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ETS2 / ATS 游戏</text>
    <text x="84" y="116" text-anchor="middle" fill="#8b8b8f" font-size="11">（运行中）</text>

    <line x1="152" y1="102" x2="196" y2="102" stroke="#00d4a4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="204" y="70" width="140" height="64" rx="8" fill="#26262a"/>
    <text x="274" y="92" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">SCS SDK 插件</text>
    <text x="274" y="110" text-anchor="middle" fill="#8b8b8f" font-size="11">bin\win_x64\plugins</text>

    <line x1="352" y1="102" x2="396" y2="102" stroke="#00d4a4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="404" y="70" width="120" height="64" rx="8" fill="#26262a"/>
    <text x="464" y="92" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">共享内存</text>
    <text x="464" y="110" text-anchor="middle" fill="#8b8b8f" font-size="11">SCSTelemetry</text>

    <line x1="532" y1="102" x2="570" y2="102" stroke="#00d4a4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="560" y="70" width="56" height="64" rx="8" fill="#00d4a4"/>
    <text x="588" y="108" text-anchor="middle" fill="#0a0a0a" font-size="13" font-weight="bold">App</text>
    <text x="320" y="168" text-anchor="middle" fill="#8b8b8f" font-size="12">先启动游戏并装好 SDK，再启动 ETS2LA；插件只在游戏启动时加载。</text>
  </g>
</svg>